# {"wait_for_file":{"x":120,"y":200},"run_project":{"x":420,"y":200}}
demo-python-operator:
  dag_id: demo-python-operator
  tasks:
    wait_for_file:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_key: "{proj.connection.default.s3_shared.s3Uri}exemplos/demo-python-operator/inbox/?*"
      wildcard_match: true
      poke_interval: 30
      timeout: 600
      soft_fail: true
      retries: 0
    run_project:
      operator: airflow.providers.standard.operators.python.PythonOperator
      dependencies: [wait_for_file]
      python_callable: demo_tasks.run
      op_kwargs:
        inbox: "{proj.connection.default.s3_shared.s3Uri}exemplos/demo-python-operator/inbox/"
        outbox: "{proj.connection.default.s3_shared.s3Uri}exemplos/demo-python-operator/outbox/"
      retries: 0
