# {"wait_for_file":{"x":120,"y":200},"run_project":{"x":420,"y":200},"remove_source":{"x":720,"y":200}}
demo-devenv-job:
  dag_id: demo-devenv-job
  tasks:
    wait_for_file:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_key: s3://<PROJECTS_BUCKET>/<DOMAIN_ID>/<PROJECT_ID>/shared/exemplos/demo-devenv-job/inbox/?*
      wildcard_match: true
      poke_interval: 30
      timeout: 600
      soft_fail: true
      retries: 0
    run_project:
      operator: airflow.providers.amazon.aws.operators.sagemaker.SageMakerProcessingOperator
      dependencies: [wait_for_file]
      retries: 0
      config:
        ProcessingJobName: "demo-devenv-{{ macros.time.strftime('%Y%m%dT%H%M%S', macros.time.gmtime()) }}"
        RoleArn: arn:aws:iam::<ACCOUNT_ID>:role/<PROJECT_ROLE_NAME>
        AppSpecification:
          ImageUri: <JOB_IMAGE_URI>
          ContainerEntrypoint:
            - /bin/bash
            - -c
          ContainerArguments:
            - 'id; ls -ln /opt/ml/processing; sudo -n chown "$(id -u)" /opt/ml/processing/outbox && exec <JOB_PYTHON> -m awsds_demo_job --input /opt/ml/processing/inbox --output /opt/ml/processing/outbox'
        Environment:
          PYTHONPATH: /opt/ml/processing/code/src
        ProcessingResources:
          ClusterConfig:
            InstanceCount: 1
            InstanceType: ml.t3.medium
            VolumeSizeInGB: 10
        NetworkConfig:
          EnableNetworkIsolation: true
          EnableInterContainerTrafficEncryption: true
          VpcConfig:
            Subnets: [<SUBNET_AZ1>, <SUBNET_AZ2>]
            SecurityGroupIds: [<PROJECT_SG>]
        ProcessingInputs:
          - InputName: code
            S3Input:
              S3Uri: s3://<PROJECTS_BUCKET>/<DOMAIN_ID>/<PROJECT_ID>/shared/exemplos/demo-devenv-job/awsds-demo-job/
              LocalPath: /opt/ml/processing/code
              S3DataType: S3Prefix
              S3InputMode: File
              S3DataDistributionType: FullyReplicated
          - InputName: inbox
            S3Input:
              S3Uri: s3://<PROJECTS_BUCKET>/<DOMAIN_ID>/<PROJECT_ID>/shared/exemplos/demo-devenv-job/inbox/
              LocalPath: /opt/ml/processing/inbox
              S3DataType: S3Prefix
              S3InputMode: File
              S3DataDistributionType: FullyReplicated
        ProcessingOutputConfig:
          Outputs:
            - OutputName: outbox
              S3Output:
                S3Uri: "s3://<PROJECTS_BUCKET>/<DOMAIN_ID>/<PROJECT_ID>/shared/exemplos/demo-devenv-job/outbox/{{ macros.time.strftime('%Y%m%dT%H%M%S', macros.time.gmtime()) }}/"
                LocalPath: /opt/ml/processing/outbox
                S3UploadMode: EndOfJob
        StoppingCondition:
          MaxRuntimeInSeconds: 1800
        Tags:
          - Key: AmazonDataZoneProject
            Value: <PROJECT_ID>
    remove_source:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteObjectsOperator
      dependencies: [run_project]
      bucket: <PROJECTS_BUCKET>
      prefix: <DOMAIN_ID>/<PROJECT_ID>/shared/exemplos/demo-devenv-job/inbox/
      retries: 0
